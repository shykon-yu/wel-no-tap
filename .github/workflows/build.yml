name: Build WEL no-TAP prototype

on:
  push:
    paths:
      - '**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wel-no-tap-build
  cancel-in-progress: true

jobs:
  build-x86:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build TAP/n2n runtime sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path build/x86, frontend/resources/tap, frontend/resources/welhelper/game-runtime | Out-Null
          if (-not (Test-Path third_party/n2n/n2n-3.0.zip)) { throw 'Missing third_party/n2n/n2n-3.0.zip' }
          Remove-Item .n2n-build -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive third_party/n2n/n2n-3.0.zip .n2n-build
          Move-Item .n2n-build/n2n-3.0 .n2n-build/source
          cmake -S .n2n-build/source -B .n2n-build/build -DN2N_OPTION_USE_PTHREAD=OFF -DCMAKE_POLICY_DEFAULT_CMP0091=NEW -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded '-DCMAKE_C_FLAGS_RELEASE=/MT /O2 /Ob2 /DNDEBUG' '-DCMAKE_POLICY_VERSION_MINIMUM=3.5'
          cmake --build .n2n-build/build --config Release --target edge --parallel 2
          Copy-Item .n2n-build/build/Release/edge.exe build/x86/edge.exe -Force
          Copy-Item .n2n-build/build/Release/edge.exe frontend/resources/welhelper/edge.exe -Force
          if (-not (Test-Path frontend/resources/tap/tapctl.exe)) { throw 'Missing frontend/resources/tap/tapctl.exe' }
          if (-not (Test-Path frontend/resources/tap/weltap.exe)) { throw 'Missing frontend/resources/tap/weltap.exe' }
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build observation and no-TAP connection tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = 'build/x86'
          New-Item $output -ItemType Directory -Force | Out-Null
          $juiceOutput = 'build/x86/libjuice'
          New-Item $juiceOutput -ItemType Directory -Force | Out-Null
          function Invoke-Compiler([string]$label, [string[]]$arguments) {
            $compilerOutput = & cl.exe @arguments 2>&1
            $compilerExit = $LASTEXITCODE
            $compilerOutput | ForEach-Object { Write-Host $_ }
            if ($compilerExit -ne 0) {
              $compilerOutput | ForEach-Object { Write-Host "::error title=MSVC ${label}::$_" }
              throw "$label build failed"
            }
          }
          $juiceSources = Get-ChildItem 'third_party/libjuice/src' -Filter '*.c' | ForEach-Object { $_.FullName }
          foreach ($juiceSource in $juiceSources) {
            $juiceObject = Join-Path $juiceOutput (([IO.Path]::GetFileNameWithoutExtension($juiceSource)) + '.obj')
            Invoke-Compiler 'libjuice static library' @(
              '/nologo', '/W3', '/O2', '/MT', '/c', '/DWIN32_LEAN_AND_MEAN', '/DNOMINMAX', '/DJUICE_STATIC', '/D_WIN32_WINNT=0x0601', '/D_CRT_SECURE_NO_WARNINGS',
              '/Ithird_party/libjuice/include', '/Ithird_party/libjuice/include/juice', '/Ithird_party/libjuice/src', $juiceSource, "/Fo:$juiceObject"
            )
          }
          $juiceObjects = Get-ChildItem $juiceOutput -Filter '*.obj' | ForEach-Object { $_.FullName }
          & lib.exe /nologo /OUT:$output/juice-static.lib $juiceObjects
          if ($LASTEXITCODE -ne 0) { throw 'libjuice static library build failed' }
          Invoke-Compiler 'trace DLL' @(
            '/nologo', '/W4', '/O2', '/MT', '/D_CRT_SECURE_NO_WARNINGS', '/D_WIN32_WINNT=0x0601',
            '/LD', 'native/welnpt_trace.c', "/Fe:$output/welnpttrace.dll", '/link', 'Ws2_32.lib', 'Psapi.lib'
          )
          Invoke-Compiler 'virtual socket DLL' @(
            '/nologo', '/W4', '/O2', '/MT', '/D_CRT_SECURE_NO_WARNINGS', '/D_WIN32_WINNT=0x0601',
            '/LD', 'native/welnpt_hook.c', "/Fe:$output/welnpt.dll", '/link', 'Ws2_32.lib', 'Psapi.lib'
          )
          Invoke-Compiler 'external Host transport' @(
            '/nologo', '/W4', '/O2', '/MT', '/D_CRT_SECURE_NO_WARNINGS', '/D_WIN32_WINNT=0x0601',
            'native/welnpt_host.c', "/Fe:$output/welnpthost.exe", '/link', 'Ws2_32.lib'
          )
          & "$output/welnpthost.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw 'external Host self-test failed' }
          Invoke-Compiler 'UDP relay' @(
            '/nologo', '/W4', '/O2', '/MT', '/D_CRT_SECURE_NO_WARNINGS', '/D_WIN32_WINNT=0x0601',
            'native/welnpt_relay.c', "/Fe:$output/welnptrelay.exe", '/link', 'Ws2_32.lib'
          )
          & "$output/welnptrelay.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw 'relay self-test failed' }
          Invoke-Compiler 'console launcher' @(
            '/nologo', '/W4', '/O2', '/MT', '/D_CRT_SECURE_NO_WARNINGS', '/D_WIN32_WINNT=0x0601',
            'native/welnpt_launcher.c', "/Fe:$output/welnptgame.exe"
          )
          & "$output/welnptgame.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw 'launcher self-test failed' }
          Invoke-Compiler 'GUI launcher' @(
            '/nologo', '/W4', '/O2', '/MT', '/utf-8', '/D_CRT_SECURE_NO_WARNINGS', '/DUNICODE', '/D_UNICODE',
            '/D_WIN32_WINNT=0x0601', 'native/welnpt_gui.c', "/Fe:$output/WEL无网卡观测工具.exe",
            '/link', 'User32.lib', 'Gdi32.lib', 'Comdlg32.lib', 'Shell32.lib', '/SUBSYSTEM:WINDOWS'
          )
          Invoke-Compiler 'connection GUI' @(
            '/nologo', '/W4', '/O2', '/MT', '/utf-8', '/D_CRT_SECURE_NO_WARNINGS', '/DUNICODE', '/D_UNICODE',
            '/D_WIN32_WINNT=0x0601', 'native/welnpt_connect_gui.c', "/Fe:$output/WEL无网卡联机.exe",
            '/link', 'User32.lib', 'Gdi32.lib', 'Comdlg32.lib', 'Shell32.lib', 'Winhttp.lib', '/SUBSYSTEM:WINDOWS'
          )
          Invoke-Compiler 'TAP game hook' @('/nologo','/W4','/O2','/MT','/D_CRT_SECURE_NO_WARNINGS','/D_WIN32_WINNT=0x0601','/LD','native/wel-game/wel_game_hook.c','/Fe:build/x86/welhook.dll','/link','Ws2_32.lib','Psapi.lib')
          Invoke-Compiler 'TAP game launcher' @('/nologo','/W4','/O2','/MT','/D_CRT_SECURE_NO_WARNINGS','/D_WIN32_WINNT=0x0601','native/wel-game/wel_game_launcher.c','/Febuild/x86/welgame.exe')
          Invoke-Compiler 'TAP firewall helper' @('/nologo','/W4','/O2','/MT','/D_CRT_SECURE_NO_WARNINGS','/D_WIN32_WINNT=0x0601','native/wel-firewall/wel_firewall.c','/Febuild/x86/welfirewall.exe','/link','Shell32.lib','/SUBSYSTEM:WINDOWS')
          Copy-Item build/x86/welhook.dll frontend/resources/welhelper/game-runtime/welhook.dll -Force
          Copy-Item build/x86/welgame.exe frontend/resources/welhelper/game-runtime/welgame.exe -Force
          Copy-Item build/x86/welfirewall.exe frontend/resources/welhelper/welfirewall.exe -Force
          Invoke-Compiler 'libjuice ICE helper' @(
            '/nologo', '/W4', '/O2', '/MT', '/D_CRT_SECURE_NO_WARNINGS', '/D_WIN32_WINNT=0x0601',
            '/Ithird_party/libjuice/include', 'native/welnpt_ice.c', "/Fe:$output/welnptice.exe",
            '/link', 'Ws2_32.lib', 'Iphlpapi.lib', "$output/juice-static.lib"
          )
          & "$output/welnptice.exe" --stun-host 127.0.0.1 --stun-port 3478 --hook-port 49000 --ice-port 49001 --validate-args
          if ($LASTEXITCODE -ne 0) { throw 'libjuice ICE helper argument validation failed' }
          & "$output/welnptice.exe" --stun-host 127.0.0.1 --stun-port 3478 --no-hook --validate-args
          if ($LASTEXITCODE -ne 0) { throw 'libjuice ICE helper no-hook validation failed' }
          Compress-Archive -Path "$output/*" -DestinationPath 'build/WEL无网卡云中继-P2-x86-完整包.zip' -Force
      - name: Upload complete Windows package
        uses: actions/upload-artifact@v4
        with:
          name: WEL无网卡云中继-P2-x86-完整包
          path: build/WEL无网卡云中继-P2-x86-完整包.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload prototype binaries
        uses: actions/upload-artifact@v4
        with:
          name: WEL无网卡云中继-P2-x86
          path: build/x86/*
          if-no-files-found: error
          retention-days: 14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Electron dependencies
        shell: pwsh
        working-directory: frontend
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci --ignore-scripts --no-audit --no-fund --prefer-offline

      - name: Build Vue frontend
        shell: pwsh
        working-directory: frontend
        run: |
          $ErrorActionPreference = 'Stop'
          npm run build

      - name: Package Electron installer
        shell: pwsh
        working-directory: frontend
        run: |
          $ErrorActionPreference = 'Stop'
          npx --no-install electron-builder --win nsis --publish never

      - name: Upload Electron installer
        uses: actions/upload-artifact@v4
        with:
          name: WEL对战平台-安装包
          path: frontend/release/*.exe
          if-no-files-found: error
          retention-days: 14

  build-linux-relay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and self-test Linux relay
        run: ./scripts/build-linux-relay.sh
      - name: Upload Linux relay
        uses: actions/upload-artifact@v4
        with:
          name: WEL无网卡云中继-P2-linux-x64
          path: build/linux-x64/welnpt-relay
          if-no-files-found: error
          retention-days: 14
