listening-port=3478
listening-ip=0.0.0.0
# Optional on an IPv6-enabled server: listening-ip=::
no-cli
fingerprint
simple-log
log-file=/var/log/coturn/wel-stun.log
no-tls
no-dtls
no-multicast-peers
# Enable TURN only on the live server by adding lt-cred-mech, realm and user.
# Keep the actual password out of Git.
# lt-cred-mech
# realm=welgame.example
# user=wel:<strong-secret>
# min-port=49152
# max-port=65535
